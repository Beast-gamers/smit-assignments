var username = prompt("Enter your username:");

var invalid = false;

for (var i = 0; i < username.length; i++) {
    var code = username.charCodeAt(i);

    if (code === 33 || code === 44 || code === 46 || code === 64) {
        invalid = true;
        break;
    }
}

while (invalid === true) {
    console.log("Please enter a valid username");

    username = prompt("Enter a valid username:");

    invalid = false;

    for (var i = 0; i < username.length; i++) {
        var code = username.charCodeAt(i);

        if (code === 33 || code === 44 || code === 46 || code === 64) {
            invalid = true;
            break;
        }
    }
}

console.log("Username: " + username);


var A = ["cake", "apple pie", "cookie", "chips", "patties"];

var searchItem = prompt("Welcome to ABC Bakery. What do you want to order sir/ma'am?");

var found = false;
var index = -1;

for (var i = 0; i < A.length; i++) {
    if (A[i].toLowerCase() === searchItem.toLowerCase()) {
        found = true;
        index = i;
        break;
    }
}

if (found === true) {
    console.log(searchItem + " is available at index " + index + " in our bakery");
}
else {
    console.log("We are sorry. " + searchItem + " is not available in our bakery");
}


var password = prompt("Enter a password:");

var valid = false;

while (valid === false) {

    var hasLetter = false;
    var hasNumber = false;
    var startsWithNumber = false;

    if (password.length >= 6) {

        var firstCode = password.charCodeAt(0);

        if (firstCode >= 48 && firstCode <= 57) {
            startsWithNumber = true;
        }

        for (var i = 0; i < password.length; i++) {

            var code = password.charCodeAt(i);

            if (
                (code >= 65 && code <= 90) ||
                (code >= 97 && code <= 122)
            ) {
                hasLetter = true;
            }

            if (code >= 48 && code <= 57) {
                hasNumber = true;
            }
        }
    }

    if (password.length < 6) {
        console.log("Password must be at least 6 characters long");
    }
    else if (startsWithNumber === true) {
        console.log("Password can not begin with a number");
    }
    else if (hasLetter === false || hasNumber === false) {
        console.log("Password must contain alphabets and numbers");
    }
    else {
        valid = true;
    }

    if (valid === false) {
        console.log("Please enter a valid password");
        password = prompt("Enter a valid password:");
    }
}

console.log("Valid password");
