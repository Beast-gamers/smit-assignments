<script>

// ==============================

// ==============================

// ==============================

if (gender === "male") {
    console.log("Good Morning Sir.");
}
else if (gender === "female") {
    console.log("Good Morning Ma'am.");
}


// ==============================
// Q3: TRAFFIC SIGNAL
// ==============================

var signal = prompt("Enter traffic signal color (Red/Yellow/Green):");

if (signal === "Red") {
    console.log("Must Stop");
}

}
else if (signal === "Green") {

// ==============================
// Q4: CAR FUEL
// ==============================

var fuel = prompt("Enter remaining fuel in litres:");

if (fuel < 0.25) {
    console.log("Please refill the fuel in your car");

// ==============================
// Q5: CHECK THE FOLLOWING
// ==============================

// 5a

if (++a === 5) {
    console.log("given condition for variable a is true");
}

// 5b
var b = 82;

if (b++ === 83) {
    console.log("given condition for variable b is true");

// 5c
var c = 12;

if (c++ === 13) {

// ==============================
// Q6: MARKSHEET
// ==============================

var subject1 = +prompt("Enter marks for Subject 1:");
var subject2 = +prompt("Enter marks for Subject 2:");
var subject3 = +prompt("Enter marks for Subject 3:");

var totalMarks = +prompt("Enter total marks:");

var obtainedMarks = subject1 + subject2 + subject3;

var percentage = (obtainedMarks / totalMarks) * 100;

var grade;
var remarks;

if (percentage >= 80) {
    grade = "A-one";
    remarks = "Excellent";
}
else if (percentage >= 70) {
    grade = "A";
    remarks = "Good";
}
else if (percentage >= 60) {
    grade = "B";
    remarks = "You need to improve";
}
else {
    grade = "Fail";
    remarks = "Sorry";
}

console.log("Marks Sheet");
console.log("Total marks: " + totalMarks);
console.log("Marks obtained: " + obtainedMarks);
console.log("Percentage: " + percentage + "%");
console.log("Grade: " + grade);
console.log("Remarks: " + remarks);


// ==============================
// Q7: GUESS GAME
// ==============================

var secretNumber = 7;

var guess = +prompt("Guess the secret number (1-10):");

if (guess === secretNumber) {
    console.log("Bingo! Correct answer");
}
else if (guess + 1 === secretNumber) {
    console.log("Close enough to the correct answer");
}


// ==============================
// Q8: DIVISIBLE BY 3
// ==============================

var number1 = +prompt("Enter a number:");

if (number1 % 3 === 0) {
    console.log("The number is divisible by 3");
}


// ==============================
// Q9: EVEN OR ODD
// ==============================

var number2 = +prompt("Enter a number to check even or odd:");

if (number2 % 2 === 0) {
    console.log("Even number");
}
else {
    console.log("Odd number");
}


// ==============================
// Q10: TEMPERATURE
// ==============================

var temperature = +prompt("Enter temperature:");

if (temperature > 40) {
    console.log("It is too hot outside.");
}
else if (temperature > 30) {
    console.log("The Weather today is Normal.");
}
else if (temperature > 20) {
    console.log("Today's Weather is cool.");
}
else if (temperature > 10) {
    console.log("OMG! Today's weather is so Cool.");
}


// ==============================
// Q11: CALCULATOR
// ==============================

var num1 = +prompt("Enter first number:");
var num2 = +prompt("Enter second number:");

var operation = prompt("Enter operation (+, -, *, /, %):");

if (operation === "+") {
    console.log("Result: " + (num1 + num2));
}
else if (operation === "-") {
    console.log("Result: " + (num1 - num2));
}
else if (operation === "*") {
    console.log("Result: " + (num1 * num2));
}
else if (operation === "/") {
    console.log("Result: " + (num1 / num2));
}
else if (operation === "%") {
    console.log("Result: " + (num1 % num2));
}
else {
    console.log("Invalid operation");
}

</script>
