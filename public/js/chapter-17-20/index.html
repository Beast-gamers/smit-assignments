// ==============================
// Q4: MULTIPLICATION TABLE
// ==============================

var tableNumber = +prompt("Enter a number to show its multiplication table:");
var tableLength = +prompt("Enter length of multiplication table:");

console.log("Multiplication table of " + tableNumber);
console.log("Length " + tableLength);

for (var i = 1; i <= tableLength; i++) {
    console.log(tableNumber + " x " + i + " = " + (tableNumber * i));
}


// ==============================
// Q5: FRUITS ARRAY
// ==============================

var fruits = ["apple", "banana", "mango", "orange", "strawberry"];

for (var i = 0; i < fruits.length; i++) {
    console.log(fruits[i]);
}

for (var i = 0; i < fruits.length; i++) {
    console.log("Element at index " + i + " is " + fruits[i]);
}


// ==============================
// Q6: GENERATE SERIES
// ==============================

// a. Counting
console.log("Counting:");

for (var i = 1; i <= 15; i++) {
    console.log(i);
}


// b. Reverse counting
console.log("Reverse counting:");

for (var i = 10; i >= 1; i--) {
    console.log(i);
}


// c. Even numbers
console.log("Even:");

for (var i = 0; i <= 20; i += 2) {
    console.log(i);
}


// d. Odd numbers
console.log("Odd:");

for (var i = 1; i < 20; i += 2) {
    console.log(i);
}


// e. Series
console.log("Series:");

for (var i = 2; i <= 20; i += 2) {
    console.log(i + "k");
}


// ==============================
// Q7: SEARCH IN BAKERY ARRAY
// ==============================

var A = ["cake", "apple pie", "cookie", "chips", "patties"];

var searchItem = prompt("Welcome to ABC Bakery. What do you want to order sir/ma'am?");

var found = false;

for (var i = 0; i < A.length; i++) {
    if (A[i] === searchItem) {
        console.log(searchItem + " is available at index " + i + " in our bakery");
        found = true;
        break;
    }
}

if (found === false) {
    console.log("We are sorry. " + searchItem + " is not available in our bakery");
}


// ==============================
// Q8: LARGEST NUMBER IN ARRAY
// ==============================

var numbers = [24, 53, 78, 91, 12];

var largest = numbers[0];

for (var i = 1; i < numbers.length; i++) {
    if (numbers[i] > largest) {
        largest = numbers[i];
    }
}

console.log("Array items: " + numbers);
console.log("The largest number is " + largest);


// ==============================
// Q9: SMALLEST NUMBER IN ARRAY
// ==============================

var numbers = [24, 53, 78, 91, 12];

var smallest = numbers[0];

for (var i = 1; i < numbers.length; i++) {
    if (numbers[i] < smallest) {
        smallest = numbers[i];
    }
}

console.log("Array items: " + numbers);
console.log("The smallest number is " + smallest);


// ==============================
// Q10: MULTIPLES OF 5 FROM 1 TO 100
// ==============================

for (var i = 5; i <= 100; i += 5) {
    console.log(i);
}

</script>
