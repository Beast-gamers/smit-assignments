<!DOCTYPE html>
<html>
<head>
    <title>Arithmetic Expression</title>
</head>
<body>
    <script>
        var num = 2;
        var result = (num + 5) * 10 / 2;

        document.write("Initial value: " + num + "<br>");
        document.write("After addition: " + (num + 5) + "<br>");
        document.write("After multiplication: " + ((num + 5) * 10) + "<br>");
        document.write("Final result: " + result);
    </script>
</body>
</html>
