<!DOCTYPE html>
<html>
<head>
    <title>Assignment 6 (Q3 to End)</title>
</head>
<body>
    <script>
        var name = prompt("Enter your name:");
        document.write("<h3>Question 3</h3>");
        document.write("Hello " + name + "<br><br>");

        document.write("<h3>Question 4</h3>");
        document.write("Question 4 is blank in the provided PDF.<br><br>");

        var num = prompt("Enter a number for multiplication table:", "5");
        if (num === "" || num === null) {
            num = 5;
        }

        document.write("<h3>Question 5</h3>");
        document.write(num + " x 1 = " + (num * 1) + "<br>");
        document.write(num + " x 2 = " + (num * 2) + "<br>");
        document.write(num + " x 3 = " + (num * 3) + "<br>");
        document.write(num + " x 4 = " + (num * 4) + "<br>");
        document.write(num + " x 5 = " + (num * 5) + "<br>");
        document.write(num + " x 6 = " + (num * 6) + "<br>");
        document.write(num + " x 7 = " + (num * 7) + "<br>");
        document.write(num + " x 8 = " + (num * 8) + "<br>");
        document.write(num + " x 9 = " + (num * 9) + "<br>");
        document.write(num + " x 10 = " + (num * 10) + "<br><br>");

        var subject1 = prompt("Enter first subject name:");
        var subject2 = prompt("Enter second subject name:");
        var subject3 = prompt("Enter third subject name:");

        var totalPerSubject = 100;

        var marks1 = Number(prompt("Enter obtained marks for " + subject1 + ":"));
        var marks2 = Number(prompt("Enter obtained marks for " + subject2 + ":"));
        var marks3 = Number(prompt("Enter obtained marks for " + subject3 + ":"));

        var totalMarks = totalPerSubject * 3;
        var obtained = marks1 + marks2 + marks3;

        var per1 = marks1 / totalPerSubject * 100;
        var per2 = marks2 / totalPerSubject * 100;
        var per3 = marks3 / totalPerSubject * 100;
        var overall = obtained / totalMarks * 100;

        document.write("<h3>Question 6</h3>");

        document.write("<table border='1'>");
        document.write("<tr><th>Subject</th><th>Total Marks</th><th>Obtained Marks</th><th>Percentage</th></tr>");
        document.write("<tr><td>" + subject1 + "</td><td>100</td><td>" + marks1 + "</td><td>" + per1 + "%</td></tr>");
        document.write("<tr><td>" + subject2 + "</td><td>100</td><td>" + marks2 + "</td><td>" + per2 + "%</td></tr>");
        document.write("<tr><td>" + subject3 + "</td><td>100</td><td>" + marks3 + "</td><td>" + per3 + "%</td></tr>");
        document.write("<tr><th>Total</th><th>" + totalMarks + "</th><th>" + obtained + "</th><th>" + overall + "%</th></tr>");
        document.write("</table>");

        document.write("<h3>Question 7</h3>");
        document.write("Question 7 is blank in the provided PDF.");
    </script>
</body>
</html>
