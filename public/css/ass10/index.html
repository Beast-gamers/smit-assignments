<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grid Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <h1>Gallery</h1>
    <p>A simple photo gallery built with CSS Grid.</p>
  </header>

  <main>
    <section class="gallery">
      <figure class="gallery-item feature">
        <img src="https://picsum.photos/id/1015/1200/900" alt="Mountain river landscape">
        <figcaption>Mountain River</figcaption>
      </figure>
      <figure class="gallery-item">
        <img src="https://picsum.photos/id/1016/800/600" alt="Snowy mountain peaks">
        <figcaption>Snowy Peaks</figcaption>
      </figure>
      <figure class="gallery-item">
        <img src="https://picsum.photos/id/1018/800/600" alt="Forest and fog">
        <figcaption>Morning Fog</figcaption>
      </figure>
      <figure class="gallery-item">
        <img src="https://picsum.photos/id/1019/800/600" alt="Winding road">
        <figcaption>The Long Road</figcaption>
      </figure>
      <figure class="gallery-item">
        <img src="https://picsum.photos/id/1024/800/600" alt="Bird on a branch">
        <figcaption>Little Bird</figcaption>
      </figure>
      <figure class="gallery-item">
        <img src="https://picsum.photos/id/1025/800/600" alt="Cute pug dog">
        <figcaption>Best Friend</figcaption>
      </figure>
      <figure class="gallery-item feature">
        <img src="https://picsum.photos/id/1036/1200/900" alt="Misty lake at sunrise">
        <figcaption>Misty Lake</figcaption>
      </figure>
      <figure class="gallery-item">
        <img src="https://picsum.photos/id/1039/800/600" alt="Waterfall in the woods">
        <figcaption>Waterfall</figcaption>
      </figure>
      <figure class="gallery-item">
        <img src="https://picsum.photos/id/1041/800/600" alt="Ocean waves from above">
        <figcaption>Ocean Waves</figcaption>
      </figure>
      <figure class="gallery-item">
        <img src="https://picsum.photos/id/1043/800/600" alt="City buildings">
        <figcaption>City Lights</figcaption>
      </figure>
      <figure class="gallery-item">
        <img src="https://picsum.photos/id/1044/800/600" alt="Dew on a leaf">
        <figcaption>Dewdrops</figcaption>
      </figure>
      <figure class="gallery-item">
        <img src="https://picsum.photos/id/1050/800/600" alt="Climbing a rock face">
        <figcaption>The Climb</figcaption>
      </figure>
    </section>
  </main>
</body>
</html>
